# Aplicar obrigatoriamente com --traffic-policy-file. Apenas POST no caminho exato chega ao backend.
on_http_request:
  - expressions:
      - "req.url.path != '/api/webhooks/mercadopago' || req.method != 'POST'"
    actions:
      - type: custom-response
        config:
          status_code: 404
          body: Not Found
          headers:
            content-type: text/plain
