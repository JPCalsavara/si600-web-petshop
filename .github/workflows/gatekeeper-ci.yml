name: AI Gatekeeper Quality Gate (GitLab Bridge)

on:
  push:
    branches:
      - main
      - dev
      - 'member/**'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gatekeeper-review:
    name: AI Quality Gatekeeper & SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (Spring Boot)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20 (React, Vite & Cypress)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.11 (Gatekeeper & Harness)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'docs/gatekeeper/requirements-gatekeeper.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/gatekeeper/requirements-gatekeeper.txt

      - name: Run Test Suite (Spring Boot, React & Cypress)
        id: run-tests
        run: |
          echo "=== Step 1: Running Tests ==="
          touch tests.log

          # 1.1 Java Spring Boot Backend
          if [ -f "pom.xml" ] || [ -f "backend/pom.xml" ]; then
            POM_DIR="."
            [ -f "backend/pom.xml" ] && POM_DIR="backend"
            echo "Running Java Spring Boot tests in $POM_DIR..."
            if [ -x "$POM_DIR/mvnw" ]; then
              "$POM_DIR/mvnw" -f "$POM_DIR/pom.xml" test >> tests.log 2>&1 || true
            else
              mvn -f "$POM_DIR/pom.xml" test >> tests.log 2>&1 || true
            fi
          elif [ -f "gradlew" ] || [ -f "build.gradle" ] || [ -f "backend/build.gradle" ]; then
            GRADLE_DIR="."
            [ -f "backend/build.gradle" ] && GRADLE_DIR="backend"
            echo "Running Gradle tests in $GRADLE_DIR..."
            if [ -x "$GRADLE_DIR/gradlew" ]; then
              "$GRADLE_DIR/gradlew" -p "$GRADLE_DIR" test >> tests.log 2>&1 || true
            else
              gradle -p "$GRADLE_DIR" test >> tests.log 2>&1 || true
            fi
          fi

          # 1.2 React / Vite / Cypress Frontend
          if [ -f "package.json" ] || [ -f "frontend/package.json" ]; then
            PKG_DIR="."
            [ -f "frontend/package.json" ] && PKG_DIR="frontend"
            echo "Running React / Vite tests in $PKG_DIR..."
            npm --prefix "$PKG_DIR" install || true
            npm --prefix "$PKG_DIR" test >> tests.log 2>&1 || true
            if [ -d "$PKG_DIR/cypress" ]; then
              echo "Running Cypress E2E tests in $PKG_DIR..."
              npx --prefix "$PKG_DIR" cypress run >> tests.log 2>&1 || true
            fi
          fi

          echo "Tests log lines: $(wc -l < tests.log)"

      - name: Extract Git Diff
        id: extract-diff
        run: |
          echo "=== Step 2: Extracting Diff ==="
          BASE_TARGET="dev"
          if [ "${{ github.ref_name }}" = "dev" ] || [ "${{ github.base_ref }}" = "main" ]; then
            BASE_TARGET="main"
          fi

          git fetch origin "$BASE_TARGET" || true
          
          if [ -n "${{ github.base_ref }}" ]; then
            echo "Pull request diff against ${{ github.base_ref }}..."
            git diff "origin/${{ github.base_ref }}...HEAD" > diff.txt || true
          else
            echo "Push diff against origin/${BASE_TARGET}..."
            git diff "origin/${BASE_TARGET}...HEAD" > diff.txt || true
          fi

          if [ ! -s diff.txt ]; then
            echo "Diff against ${BASE_TARGET} is empty; falling back to HEAD~1..."
            git diff HEAD~1 > diff.txt || true
          fi

          echo "Diff extracted: $(wc -l < diff.txt) lines."

      - name: Fetch SonarQube / SonarCloud Issues
        id: run-sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          echo "=== Step 3: SonarQube / SonarCloud Analysis ==="
          bash .agents/skills/sonarqube-runner/scripts/run_sonar.sh --target . --api || true

      - name: Build Context Harness Vector Index
        run: |
          echo "=== Step 4: Context Harness ==="
          python docs/gatekeeper/build_harness.py --docs docs README.md CONTEXT.md --output context_harness.json || true

      - name: Run AI Gatekeeper Supervisor
        id: gatekeeper
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
        run: |
          echo "=== Step 5: AI Gatekeeper Multi-Agent Review ==="
          python docs/gatekeeper/gatekeeper.py --target . || true

      - name: Publish GitHub Summary
        if: always()
        run: |
          if [ -f "report.md" ]; then
            cat report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Report Back to GitLab (Unicamp)
        if: always()
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          GITLAB_URL: ${{ secrets.GITLAB_URL || 'https://gitlab.unicamp.br' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          echo "=== Step 6: Reporting to GitLab Merge Request ==="
          python docs/gatekeeper/gitlab_reporter.py \
            --report report.md \
            --sha "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" \
            --target-url "$GITHUB_RUN_URL" || true

      - name: Enforce Gatekeeper Quality Gate
        run: |
          if [ -f "report.md" ]; then
            if grep -Eqi "(REJECTED|REPROVADO)" report.md; then
              echo "[ERROR] AI Gatekeeper REJECTED the changes. Blocking CI pipeline."
              exit 1
            fi
            echo "[SUCCESS] AI Gatekeeper APPROVED the changes."
          fi
