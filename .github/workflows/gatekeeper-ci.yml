name: CI/CD Simplificado (GitLab Bridge)

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: Lint & Tests (Backend/Frontend/E2E)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (Spring Boot)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20 (React, Vite & Cypress)
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'

      - name: Set up Python 3.11 (GitLab Reporter)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize Database (PostgreSQL)
        run: |
          docker compose up -d postgres
          sleep 5

      - name: Linter & Unit/Integration Tests (Backend)
        run: |
          echo "=== Running Backend Tests & Compilation ==="
          cd backend
          ./mvnw clean test

      - name: Linter & Tests (Frontend)
        run: |
          echo "=== Running Frontend Typecheck (Linter) and Tests ==="
          cd frontend
          npm ci
          npm run build
          npm run test --if-present

      - name: Start Full Environment for E2E
        run: |
          echo "=== Starting full docker-compose for E2E ==="
          docker compose up -d backend frontend
          # Wait for services to be ready
          echo "Waiting for Backend to be healthy..."
          timeout 60 bash -c 'until curl -s http://localhost:8080/api/projects > /dev/null; do sleep 2; done' || true
          echo "Waiting for Frontend to be healthy..."
          timeout 60 bash -c 'until curl -s http://localhost:5173 > /dev/null; do sleep 2; done' || true

      - name: Run E2E Tests (Cypress)
        run: |
          echo "=== Running Cypress E2E tests ==="
          cd frontend
          npx cypress run

      - name: Generate Success Report
        if: success()
        run: |
          echo "## CI/CD Pipeline Report" > report.md
          echo "### Supervisor Verdict" >> report.md
          echo "**APPROVED**: Linter, Testes de Integração e E2E executados com sucesso!" >> report.md

      - name: Generate Failure Report
        if: failure()
        run: |
          echo "## CI/CD Pipeline Report" > report.md
          echo "### Supervisor Verdict" >> report.md
          echo "**REJECTED**: Falha em uma das etapas do CI (Backend, Frontend ou E2E)." >> report.md

      - name: Report Back to GitLab (Unicamp)
        if: always()
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: '6372'
          GITLAB_URL: ${{ secrets.GITLAB_URL || 'https://gitlab.unicamp.br' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          echo "=== Reporting to GitLab Merge Request ==="
          python docs/gatekeeper/gitlab_reporter.py \
            --report report.md \
            --sha "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" \
            --target-url "$GITHUB_RUN_URL" || true
