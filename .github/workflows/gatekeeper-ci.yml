name: CI/CD Simplificado com AI Gatekeeper

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gatekeeper-review:
    name: AI Gatekeeper Review (Testes & Linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'docs/gatekeeper/requirements-gatekeeper.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip --only-binary :all:
          pip install --only-binary :all: -r docs/gatekeeper/requirements-gatekeeper.txt

      - name: Initialize Database (PostgreSQL)
        run: |
          docker compose up -d postgres
          sleep 5

      - name: Linter & Tests (Backend/Frontend/E2E)
        run: |
          touch tests.log
          
          echo "=== Running Backend Tests ==="
          cd backend
          ./mvnw clean test >> ../tests.log 2>&1
          BACKEND_STATUS=$?
          cd ..
          
          echo "=== Running Frontend Tests & Linter ==="
          cd frontend
          npm ci >> ../tests.log 2>&1
          NPM_CI_STATUS=$?
          npm run build >> ../tests.log 2>&1
          BUILD_STATUS=$?
          npm run test --if-present >> ../tests.log 2>&1
          FRONTEND_STATUS=$?
          cd ..
          
          echo "=== Starting Full Env for E2E ==="
          docker compose up -d backend frontend
          timeout 60 bash -c 'until curl -s http://localhost:8080/api/projects > /dev/null; do sleep 2; done' || true
          timeout 60 bash -c 'until curl -s http://localhost:5173 > /dev/null; do sleep 2; done' || true
          
          echo "=== Running Cypress E2E ==="
          cd frontend
          npx cypress run >> ../tests.log 2>&1
          E2E_STATUS=$?
          cd ..

          # Determine statuses
          BACKEND_STR="success"
          if [ $BACKEND_STATUS -ne 0 ]; then BACKEND_STR="failed"; fi
          
          FRONT_STR="success"
          if [ $NPM_CI_STATUS -ne 0 ] || [ $BUILD_STATUS -ne 0 ] || [ $FRONTEND_STATUS -ne 0 ]; then FRONT_STR="failed"; fi
          
          E2E_STR="success"
          if [ $E2E_STATUS -ne 0 ]; then E2E_STR="failed"; fi
          
          VERDICT="APPROVED"
          if [ "$BACKEND_STR" = "failed" ] || [ "$FRONT_STR" = "failed" ] || [ "$E2E_STR" = "failed" ]; then VERDICT="REJECTED"; fi

          # Generate report
          cat <<EOF > report.md
## Porteiro do CI/CD (\${{ github.ref_name }})

### Supervisor Verdict
**$VERDICT**: $(if [ "$VERDICT" = "APPROVED" ]; then echo "Todas as etapas foram concluídas com sucesso!"; else echo "Falha detectada em uma ou mais etapas dos testes."; fi)

> *O Revisor de IA Gatekeeper está temporariamente desativado.*

### Status das Etapas
- **Backend (Lint & Testes):** $BACKEND_STR
- **Frontend (Lint & Testes):** $FRONT_STR
- **E2E (Cypress):** $E2E_STR
EOF

          if [ "$VERDICT" = "REJECTED" ]; then
            echo -e "\n### 🚨 Logs de Erro Extraídos\n<details>\n<summary>Clique para expandir os trechos com erro</summary>\n\n\`\`\`text" >> report.md
            grep -iE "fail|error|exception" -B 2 -A 5 tests.log | tail -n 50 >> report.md || echo "Nenhuma linha específica identificada." >> report.md
            echo -e "\n\`\`\`\n</details>" >> report.md
            
            echo "[ERROR] Tests failed."
            exit 1
          fi

      - name: Extract Git Diff
        run: |
          BASE_TARGET="dev"
          if [ "${{ github.ref_name }}" = "dev" ] || [ "${{ github.base_ref }}" = "main" ]; then
            BASE_TARGET="main"
          fi
          git fetch origin "$BASE_TARGET" || true
          git diff "origin/${BASE_TARGET}...HEAD" > diff.txt || git diff HEAD~1 > diff.txt || true

      - name: Build Context Harness Vector Index
        run: |
          python docs/gatekeeper/build_harness.py --docs docs README.md CONTEXT.md --output context_harness.json || true

      - name: Report Back to GitLab (Unicamp)
        if: always()
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: '6372'
          GITLAB_URL: ${{ secrets.GITLAB_URL || 'https://gitlab.unicamp.br' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python docs/gatekeeper/gitlab_reporter.py \
            --report report.md \
            --sha "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" \
            --target-url "$GITHUB_RUN_URL" || true

      - name: Enforce Gatekeeper Quality Gate
        run: |
          echo "[SUCCESS] Bypassing AI Gatekeeper."
