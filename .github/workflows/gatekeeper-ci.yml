name: CI/CD Simplificado (GitLab Bridge)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: Lint & Tests (Backend/Frontend/E2E)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (Spring Boot)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20 (React, Vite & Cypress)
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'

      - name: Set up Python 3.11 (GitLab Reporter)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize Database (PostgreSQL)
        run: |
          docker compose up -d postgres
          sleep 5

      - name: Linter & Unit/Integration Tests (Backend)
        id: backend_tests
        run: |
          echo "=== Running Backend Tests & Compilation ==="
          cd backend
          ./mvnw clean test 2>&1 | tee ../backend_tests.log

      - name: Linter & Tests (Frontend)
        id: frontend_tests
        run: |
          echo "=== Running Frontend Typecheck (Linter) and Tests ==="
          cd frontend
          npm ci 2>&1 | tee ../frontend_tests.log
          npm run build 2>&1 | tee -a ../frontend_tests.log
          npm run test --if-present 2>&1 | tee -a ../frontend_tests.log

      - name: Start Full Environment for E2E
        run: |
          echo "=== Starting full docker-compose for E2E ==="
          docker compose up -d backend frontend
          # Wait for services to be ready
          echo "Waiting for Backend to be healthy..."
          timeout 60 bash -c 'until curl -s http://localhost:8080/api/projects > /dev/null; do sleep 2; done' || true
          echo "Waiting for Frontend to be healthy..."
          timeout 60 bash -c 'until curl -s http://localhost:5173 > /dev/null; do sleep 2; done' || true

      - name: Run E2E Tests (Cypress)
        id: e2e_tests
        run: |
          echo "=== Running Cypress E2E tests ==="
          cd frontend
          npx cypress run 2>&1 | tee ../e2e_tests.log

      - name: Generate Pipeline Report
        if: always()
        run: |
          echo "## CI/CD Pipeline Report" > report.md
          
          if [ "${{ job.status }}" = "success" ]; then
            echo "### Supervisor Verdict" >> report.md
            echo "**APPROVED**: Todas as etapas foram concluídas com sucesso!" >> report.md
          else
            echo "### Supervisor Verdict" >> report.md
            echo "**REJECTED**: Falha em uma ou mais etapas do CI." >> report.md
          fi
          
          echo "" >> report.md
          echo "### Status das Etapas" >> report.md
          echo "- **Backend (Lint & Testes):** ${{ steps.backend_tests.outcome }}" >> report.md
          echo "- **Frontend (Lint & Testes):** ${{ steps.frontend_tests.outcome }}" >> report.md
          echo "- **E2E (Cypress):** ${{ steps.e2e_tests.outcome }}" >> report.md
          
          if [ "${{ job.status }}" != "success" ]; then
            echo "" >> report.md
            echo "### Logs de Erro" >> report.md
            
            if [ "${{ steps.backend_tests.outcome }}" = "failure" ] && [ -f backend_tests.log ]; then
              echo "<details><summary><b>Ver Logs do Backend (Últimas 100 linhas)</b></summary>" >> report.md
              echo "" >> report.md
              echo "\`\`\`text" >> report.md
              tail -n 100 backend_tests.log >> report.md
              echo "\`\`\`" >> report.md
              echo "</details>" >> report.md
            fi
            
            if [ "${{ steps.frontend_tests.outcome }}" = "failure" ] && [ -f frontend_tests.log ]; then
              echo "<details><summary><b>Ver Logs do Frontend (Últimas 100 linhas)</b></summary>" >> report.md
              echo "" >> report.md
              echo "\`\`\`text" >> report.md
              tail -n 100 frontend_tests.log >> report.md
              echo "\`\`\`" >> report.md
              echo "</details>" >> report.md
            fi
            
            if [ "${{ steps.e2e_tests.outcome }}" = "failure" ] && [ -f e2e_tests.log ]; then
              echo "<details><summary><b>Ver Logs do E2E Cypress (Últimas 100 linhas)</b></summary>" >> report.md
              echo "" >> report.md
              echo "\`\`\`text" >> report.md
              tail -n 100 e2e_tests.log >> report.md
              echo "\`\`\`" >> report.md
              echo "</details>" >> report.md
            fi
          fi

      - name: Report Back to GitLab (Unicamp)
        if: always()
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: '6372'
          GITLAB_URL: ${{ secrets.GITLAB_URL || 'https://gitlab.unicamp.br' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          echo "=== Reporting to GitLab Merge Request ==="
          python docs/gatekeeper/gitlab_reporter.py \
            --report report.md \
            --sha "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" \
            --target-url "$GITHUB_RUN_URL" || true
