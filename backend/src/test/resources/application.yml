server:
  port: 0
  servlet:
    context-path: /api

spring:
  application:
    name: eventos-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

storage:
  b2:
    enabled: false

notification:
  deadlines:
    # US-10: nos testes o job é disparado manualmente (DeadlineNotificationService.run()).
    enabled: false

app:
  security:
    # Mantém os testes antigos (cabeçalhos X-Authenticated-User-*) funcionando. A US-01 desliga isso no AuthIntegrationTest.
    legacy-headers: true
  auth:
    session-cleanup:
      # A limpeza de sessões expiradas é testada chamando o serviço direto, sem esperar o agendador.
      enabled: false
