server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: eventos-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/petshop_db}
    username: ${SPRING_DATASOURCE_USERNAME:petshop_user}
    password: ${SPRING_DATASOURCE_PASSWORD:petshop_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
