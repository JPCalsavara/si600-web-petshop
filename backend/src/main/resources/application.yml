server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: eventos-backend
  config:
    # Carrega backend/.env.local (formato KEY=VALUE, sem aspas) quando rodar a partir de backend/.
    # Variáveis de ambiente reais continuam tendo prioridade.
    import: optional:file:.env.local[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventos_db}
    username: ${SPRING_DATASOURCE_USERNAME:eventos_user}
    password: ${SPRING_DATASOURCE_PASSWORD:eventos_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

storage:
  b2:
    enabled: ${B2_ENABLED:false}
    endpoint: ${B2_ENDPOINT:https://s3.us-east-005.backblazeb2.com}
    region: ${B2_REGION:us-east-005}
    bucket: ${B2_BUCKET:}
    key-id: ${B2_KEY_ID:}
    application-key: ${B2_APPLICATION_KEY:}

notification:
  gmail:
    # Desligado por padrão: em dev nenhum e-mail é enviado. Ver docs/us-08-notificacao-email-gmail.md.
    enabled: ${GMAIL_ENABLED:false}
    sender: ${GMAIL_SENDER:}
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    refresh-token: ${GMAIL_REFRESH_TOKEN:}
